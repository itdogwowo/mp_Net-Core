<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetBus 網頁遙控</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --panel2: #1e252e;
    --line: #2a333d; --text: #dbe2ea; --muted: #8b98a6;
    --accent: #3da9fc; --ok: #2fbf71; --warn: #e6b23c; --err: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  .badge {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
  }
  .badge.on { background: rgba(47,191,113,.15); border-color: var(--ok); color: var(--ok); }
  .badge.pause { background: rgba(230,178,60,.15); border-color: var(--warn); color: var(--warn); }
  .layout {
    display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px;
    padding: 14px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  button.danger { background: var(--err); border-color: var(--err); color: #1c0505; font-weight: 600; }
  button.warn { background: var(--warn); border-color: var(--warn); color: #241a02; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select {
    background: #0c1014; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 9px; font-size: 13px;
  }
  input[type=number] { width: 90px; }
  label { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  tr.offline td { opacity: .45; }
  tr.selected td { background: rgba(61,169,252,.07); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .progress { height: 6px; background: #0c1014; border-radius: 3px; overflow: hidden; min-width: 80px; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--muted); }
  #log {
    background: #0a0d11; border: 1px solid var(--line); border-radius: 8px;
    height: 420px; overflow-y: auto; padding: 10px; font-size: 12px;
  }
  #log .line { white-space: pre-wrap; word-break: break-all; padding: 1px 0; }
  #log .ts { color: var(--muted); margin-right: 6px; }
  #log .stderr { color: var(--err); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; }
  .hint { color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>🎬 NetBus 網頁遙控</h1>
  <span class="meta mono" id="netinfo">載入中…</span>
  <span class="badge" id="playbadge">待機</span>
</header>

<div class="layout">
  <div>
    <div class="card">
      <h2>掃描設備</h2>
      <div class="row">
        <button class="primary" data-action="scan" data-mode="broadcast">廣播掃描</button>
        <button data-action="scan" data-mode="knock">依紀錄敲門</button>
        <input id="scan_ips" placeholder="定向 IP, 例 192.168.8.139" style="flex:1; min-width:200px">
        <button data-action="scan" data-mode="direct" data-ips="#scan_ips">定向掃描</button>
      </div>
    </div>

    <div class="card">
      <h2>網卡 <span class="hint" id="netcurrent"></span></h2>
      <div class="row">
        <select id="netiface" style="flex:1; min-width:200px"></select>
        <button class="primary" id="netapply">套用網卡</button>
      </div>
    </div>

    <div class="card">
      <h2>亮度調整 (產生新 pxld)</h2>
      <div class="row">
        <select id="bright_pxld" style="flex:1; min-width:200px"></select>
        <input type="number" id="bright_factor" value="100" step="1" min="1" style="width:90px" title="%">
        <span class="hint">%</span>
        <button class="primary" id="brightapply">產生新檔</button>
      </div>
    </div>

    <div class="card">
      <h2>設備列表 <span class="hint" id="devcount"></span></h2>
      <div style="overflow-x:auto">
        <table id="devtable">
          <thead>
            <tr>
              <th></th><th>設備</th><th>PlayID</th><th>狀態</th>
              <th>幀</th><th>進度</th><th>FPS</th><th>Mem</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:10px">
        <button data-action="select_all">全選</button>
        <button data-action="select_clear">清空選擇</button>
        <button data-action="clear" class="danger">清除設備列表</button>
        <button data-action="query">查詢狀態</button>
      </div>
    </div>

    <div class="card">
      <h2>播放控制</h2>
      <div class="grid2">
        <div class="field">
          <label>資源 (pxld 主名 → /sd/{stem}.bin)</label>
          <select id="resource"><option value="">— 目前資源 —</option></select>
        </div>
        <div class="field">
          <label>音檔</label>
          <select id="mp3"><option value="">— 靜音 (僅燈效) —</option></select>
        </div>
        <div class="field">
          <label>同步延遲 sync_delay_ms (負值=先燈後音, 範圍 -60000~60000)</label>
          <input type="number" id="delay_ms" value="150" step="1" min="-60000" max="60000">
        </div>
        <div class="field">
          <label>主動同步 fps (0=關閉)</label>
          <input type="number" id="active_sync_fps" value="0" step="1" min="0">
        </div>
        <div class="field">
          <label>循環播放</label>
          <label style="margin-top:4px"><input type="checkbox" id="loop_play"> loop_play (準備時套用)</label>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="preparebtn" data-action="prepare">⏳ 準備 (選資源 + 暖機)</button>
        <button class="primary" id="firebtn" data-action="fire">▶ 播放</button>
        <button id="verifybtn" data-action="verify">🔍 驗證資源</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="latencybtn" data-action="latency">📡 延遲偵查</button>
        <button id="latencyapplybtn" data-action="latency" data-apply="1">📡 偵查並套用</button>
        <span class="hint" id="latencyres"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="directbtn" data-action="direct_test">🎬 Direct 串流測試 (紅呼吸→黑→停)</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="pausebtn" data-action="pause" class="warn">⏸ 暫停/繼續</button>
        <button id="stopbtn" data-action="stop" class="danger">■ 停止</button>
        <button id="qrbtn" style="margin-left:auto">🔳 QR Code</button>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>參數 (改完按儲存)</h2>
      <div class="grid2" id="configgrid"></div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="savecfg">儲存全部參數</button>
      </div>
    </div>

    <div class="card">
      <h2>Log</h2>
      <div class="row" style="margin-bottom:8px">
        <button id="clearlog">清空畫面</button>
        <span class="hint">自動捲到底部; 每 0.5s 更新</span>
      </div>
      <div id="log" class="mono"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var logEl = $('#log');
  var logSince = 0;
  var logCleared = false;
  var CONFIG_KEYS = [
    ['sync_delay_ms', '同步延遲 ms'], ['loop_play', '循環播放 0/1'],
    ['play_fps', '權威 fps (0=自動)'], ['active_sync_fps', '主動同步 fps'],
    ['midjoin_lead_frames', '重連追幀提前量(幀)'],
    ['latency_probe_auto', '延遲偵查自動套用 0/1'], ['latency_probe_samples', '延遲偵查樣本數'],
    ['latency_probe_warmup_s', '延遲偵查暖機 s'], ['audio_delay_base_ms', '音效啟動延遲基線 ms'],
    ['active_sync_interval_s', '同步間隔 s'],
    ['progress_poll_interval_s', '進度輪詢 s'], ['post_play_stop_delay_s', '播完熄燈延遲 s'],
    ['ws_port', 'WS 埠'], ['upt_port', 'UDP 埠'],
    ['upload_chunk_size', '上傳 chunk'], ['latency_samples', '延遲樣本數']
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function post(action, extra) {
    var body = Object.assign({ action: action }, extra || {});
    fetch('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.msg) pushLine(j.msg, j.ok === false ? 'stderr' : 'stdout');
      if (j && j.stats) {
        var t = 'min ' + j.stats.min_ms + ' / avg ' + j.stats.avg_ms + ' / max ' + j.stats.max_ms + ' ms';
        if (j.applied != null) t += '  → 已套用 sync_delay_ms=' + j.applied + 'ms';
        $('#latencyres').textContent = t;
      }
    }).catch(function (e) { pushLine('請求失敗: ' + e, 'stderr'); });
  }

  function renderDevices(devs, selected) {
    var tb = $('#devtable tbody');
    tb.innerHTML = '';
    var sel = {};
    (selected || []).forEach(function (s) { sel[s] = true; });
    devs.forEach(function (d) {
      var tr = document.createElement('tr');
      if (!d.online) tr.className = 'offline';
      if (sel[d.id]) tr.className += ' selected';
      var prog = d.total_frames > 0 ? Math.min(100, d.progress) : 0;
      tr.innerHTML =
        '<td><span class="dot ' + (d.online ? 'on' : 'off') + '"></span></td>' +
        '<td class="mono">' + esc(d.id) + '</td>' +
        '<td>' + esc(d.play_id == null ? '?' : d.play_id) + '</td>' +
        '<td>' + esc(d.status) + '</td>' +
        '<td class="mono">' + esc(d.current_frame) + '/' + esc(d.total_frames) + '</td>' +
        '<td><div class="progress"><span style="width:' + prog.toFixed(1) + '%"></span></div></td>' +
        '<td class="mono">' + esc(d.fps) + '</td>' +
        '<td class="mono">' + (d.mem_free ? Math.round(d.mem_free / 1024) + 'K' : '-') + '</td>';
      tb.appendChild(tr);
    });
    $('#devcount').textContent = '(' + devs.filter(function (d) { return d.online; }).length + ' 在線 / ' + devs.length + ' 已知)';
  }

  function renderConfig(cfg) {
    var g = $('#configgrid');
    if (!g.dataset.built) {
      g.dataset.built = '1';
      CONFIG_KEYS.forEach(function (k) {
        var div = document.createElement('div');
        div.className = 'field';
        div.innerHTML = '<label>' + esc(k[1]) + ' (' + esc(k[0]) + ')</label>' +
          '<input type="number" step="any" data-cfg="' + esc(k[0]) + '">';
        g.appendChild(div);
      });
    }
    $$('#configgrid input[data-cfg]').forEach(function (inp) {
      var k = inp.getAttribute('data-cfg');
      if (cfg && cfg[k] != null && inp !== document.activeElement) inp.value = cfg[k];
    });
  }

  function renderMp3s(mp3s) {
    var sel = $('#mp3');
    var cur = sel.value;
    var opts = '<option value="">— 靜音 (僅燈效) —</option>';
    mp3s.forEach(function (m) {
      opts += '<option value="' + esc(m) + '"' + (m === cur ? ' selected' : '') + '>' + esc(m) + '</option>';
    });
    sel.innerHTML = opts;
  }

  function renderResources(s) {
    var sel = $('#resource');
    var cur = s.resource || '';
    var opts = '<option value="">— 目前資源 —</option>';
    // pxld 主名優先 (test.pxld → test); 也併入已切分但無對應 pxld 的資源
    var stems = [];
    (s.pxlds || []).forEach(function (p) { stems.push(p.replace(/\.pxld$/i, '')); });
    (s.resources || []).forEach(function (r) { if (stems.indexOf(r) < 0) stems.push(r); });
    stems.forEach(function (st) {
      opts += '<option value="' + esc(st) + '"' + (st === cur ? ' selected' : '') + '>' + esc(st) + '.bin</option>';
    });
    sel.innerHTML = opts;
  }

  function renderNetwork(n) {
    var sel = $('#netiface');
    if (!n) return;
    var cur = n.current || '';
    var local = n.local_ip || '';
    var opts = '<option value="">— 自動偵測 —</option>';
    (n.interfaces || []).forEach(function (it) {
      var val = it.name || it.ip;
      var label = (it.name ? it.name + '  ' : '') + it.ip;
      opts += '<option value="' + esc(val) + '"' + (val === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
    });
    sel.innerHTML = opts;
    $('#netcurrent').textContent = '目前: ' + (cur || '自動') + '  |  本機 IP: ' + local;
  }

  function renderBrightPxlds(pxlds) {
    var sel = $('#bright_pxld');
    if (!sel.dataset.built) {
      sel.dataset.built = '1';
    }
    var cur = sel.value;
    var opts = '<option value="">— 選擇 pxld —</option>';
    (pxlds || []).forEach(function (p) {
      opts += '<option value="' + esc(p) + '"' + (p === cur ? ' selected' : '') + '>' + esc(p) + '</option>';
    });
    sel.innerHTML = opts;
  }

  function renderState(s) {
    $('#netinfo').textContent = '本機 ' + (s.local_ip || '?') + '  |  WS :' + (s.ws_port || 8000) + '  |  Web :' + (s.web_port || 8080);
    refreshQrUrl(s);
    var badge = $('#playbadge');
    if (s.playing && s.paused) { badge.textContent = '已暫停'; badge.className = 'badge pause'; }
    else if (s.playing) { badge.textContent = '播放中'; badge.className = 'badge on'; }
    else { badge.textContent = '待機'; badge.className = 'badge'; }
    renderDevices(s.devices, s.selected);
    renderConfig(s.config);
    renderMp3s(s.mp3s);
    renderResources(s);
    renderNetwork(s.network);
    renderBrightPxlds(s.pxlds);
    if (s.config && s.config.active_sync_fps != null) $('#active_sync_fps').value = s.config.active_sync_fps;
    if (s.loop_play != null) $('#loop_play').checked = !!s.loop_play;
  }

  function pushLine(text, stream) {
    var div = document.createElement('div');
    div.className = 'line' + (stream === 'stderr' ? ' stderr' : '');
    div.innerHTML = '<span class="ts">' + new Date().toTimeString().slice(0, 8) + '</span>' + esc(text);
    logEl.appendChild(div);
    while (logEl.children.length > 1500) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function pollState() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(renderState).catch(function () {});
  }

  function pollLogs() {
    fetch('/api/logs?since=' + logSince).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.logs) {
        j.logs.forEach(function (l) { pushLine(l.text, l.stream); });
        logSince = j.next;
      }
    }).catch(function () {});
  }

  // 按鈕綁定
  $$('button[data-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var action = btn.getAttribute('data-action');
      var extra = {};
      if (action === 'scan') {
        extra.mode = btn.getAttribute('data-mode') || 'broadcast';
        var ipsSel = btn.getAttribute('data-ips');
        if (ipsSel) extra.ips = $(ipsSel).value;
      } else if (action === 'prepare') {
        extra.resource = $('#resource').value;
        extra.delay_ms = parseInt($('#delay_ms').value, 10);
        extra.loop = $('#loop_play').checked;
        extra.active_sync_fps = parseInt($('#active_sync_fps').value, 10);
        if (isNaN(extra.delay_ms)) extra.delay_ms = 150;
        if (isNaN(extra.active_sync_fps)) extra.active_sync_fps = 0;
      } else if (action === 'fire') {
        extra.mp3 = $('#mp3').value;
      } else if (action === 'play') {
        extra.mp3 = $('#mp3').value;
        extra.resource = $('#resource').value;
        extra.delay_ms = parseInt($('#delay_ms').value, 10);
        extra.loop = btn.getAttribute('data-loop') === '1';
        extra.active_sync_fps = parseInt($('#active_sync_fps').value, 10);
        if (isNaN(extra.delay_ms)) extra.delay_ms = 150;
        if (isNaN(extra.active_sync_fps)) extra.active_sync_fps = 0;
      } else if (action === 'verify') {
        extra.resource = $('#resource').value;
      } else if (action === 'latency') {
        extra.apply = btn.getAttribute('data-apply') === '1';
      }
      post(action, extra);
    });
  });

  $('#savecfg').addEventListener('click', function () {
    $$('#configgrid input[data-cfg]').forEach(function (inp) {
      var k = inp.getAttribute('data-cfg');
      var v = parseFloat(inp.value);
      if (isNaN(v)) return;
      post('config', { key: k, value: v });
    });
  });

  $('#netapply').addEventListener('click', function () {
    post('network', { selector: $('#netiface').value });
  });

  $('#brightapply').addEventListener('click', function () {
    var p = $('#bright_pxld').value;
    var f = parseFloat($('#bright_factor').value);
    if (!p) { pushLine('請先選擇 pxld', 'stderr'); return; }
    if (isNaN(f) || f <= 0) { pushLine('亮度比例無效', 'stderr'); return; }
    post('brightness', { pxld: p, factor: f / 100 });
  });

  // ── QR Code: 掃碼即可連到正確 URL ──
  var qrUrl = '';
  function refreshQrUrl(s) {
    if (s && s.local_ip && s.web_port) {
      qrUrl = 'http://' + s.local_ip + ':' + s.web_port;
    }
  }
  $('#qrbtn').addEventListener('click', function () {
    if (!qrUrl) { pushLine('尚未取得本機 IP/埠', 'stderr'); return; }
    var qrImg = document.getElementById('qrimg');
    // 純本地: 後端 /api/qr 產生 SVG, 不連外網
    qrImg.src = '/api/qr';
    document.getElementById('qrtext').textContent = qrUrl;
    document.getElementById('qrmodal').style.display = 'flex';
  });

  $('#clearlog').addEventListener('click', function () { logEl.innerHTML = ''; });

  pollState();
  pollLogs();
  setInterval(pollState, 1000);
  setInterval(pollLogs, 500);
})();
</script>

<div id="qrmodal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:center; justify-content:center; z-index:999;">
  <div style="background:#171c22; border:1px solid #2a333d; border-radius:12px; padding:22px; text-align:center; max-width:360px;">
    <h3 style="margin:0 0 10px; font-size:15px;">掃描以連到控制台</h3>
    <img id="qrimg" alt="QR" style="width:300px; height:300px; background:#fff; border-radius:8px;">
    <div id="qrtext" class="mono" style="margin-top:12px; font-size:13px; word-break:break-all; color:#8b98a6;"></div>
    <button id="qrclose" style="margin-top:14px;">關閉</button>
  </div>
</div>
<script>
  document.getElementById('qrclose').addEventListener('click', function () {
    document.getElementById('qrmodal').style.display = 'none';
  });
  document.getElementById('qrmodal').addEventListener('click', function (e) {
    if (e.target === this) this.style.display = 'none';
  });
</script>
</body>
</html>
